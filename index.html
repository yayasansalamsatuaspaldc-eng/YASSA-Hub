<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>YASSA Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B7A45">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YASSA Hub">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #F6F7F3; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  #app { max-width: 420px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; background: #F6F7F3; position: relative; display: flex; flex-direction: column; }

  .header { background: #0B7A45; padding: 20px 20px 28px; color: #fff; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; }
  .header-top { display: flex; justify-content: space-between; align-items: center; }
  .header-greet-sub { font-size: 13px; opacity: .85; }
  .header-greet-name { font-size: 18px; font-weight: 600; }
  .bell { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.15); display: flex; align-items: center; justify-content: center; }

  .summary-card { margin-top: 18px; background: #fff; border-radius: 14px; padding: 14px 16px; color: #1F2933; display: flex; justify-content: space-between; }
  .summary-label { font-size: 12px; color: #6B7280; }
  .summary-value { font-size: 20px; font-weight: 700; color: #0B7A45; }
  .summary-value.plain { color: #1F2933; }

  .content { flex: 1; padding: 20px 16px 90px; }
  .section-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: #1F2933; }

  .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .quick-card { background: #fff; border: none; border-radius: 14px; padding: 16px 12px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.06); text-align: left; }
  .quick-icon { width: 34px; height: 34px; border-radius: 10px; background: #E7F4EC; display: flex; align-items: center; justify-content: center; }
  .quick-label { font-size: 13px; font-weight: 500; color: #1F2933; }

  .menu-panel { background: #fff; border-radius: 18px; padding: 18px 12px 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .menu-grid { display: grid; grid-template-columns: repeat(4, 1fr); row-gap: 18px; column-gap: 4px; }
  .menu-item { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; padding: 0; }
  .menu-icon { width: 52px; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; }
  .menu-label { font-size: 11px; font-weight: 500; color: #1F2933; text-align: center; line-height: 1.25; }

  .single-app-card { width: 100%; background: #fff; border: none; border-radius: 18px; padding: 18px; display: flex; gap: 14px; align-items: flex-start; text-align: left; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .single-app-icon { width: 52px; height: 52px; border-radius: 16px; background: #E7F4EC; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .single-app-title { font-size: 15px; font-weight: 600; color: #1F2933; margin-bottom: 4px; }
  .single-app-desc { font-size: 12px; color: #6B7280; line-height: 1.5; }

  .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #EEF0EC; display: flex; padding: 8px 4px; box-shadow: 0 -2px 8px rgba(0,0,0,.04); }
  .nav-btn { flex: 1; background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 2px; cursor: pointer; }
  .nav-label { font-size: 10px; text-align: center; line-height: 1.2; }

  .overlay { position: absolute; inset: 0; background: #fff; display: none; flex-direction: column; z-index: 10; }
  .overlay.open { display: flex; }
  .overlay-header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #EEF0EC; }
  .overlay-title { font-size: 15px; font-weight: 600; color: #1F2933; }
  .overlay-close { background: none; border: none; cursor: pointer; padding: 4px; }
  .overlay iframe { flex: 1; width: 100%; border: none; }

  svg { display: block; }
</style>
</head>
<body>
<div id="app">

  <div class="header">
    <div class="header-top">
      <div>
        <div class="header-greet-sub">Selamat datang,</div>
        <div class="header-greet-name">Pengurus YASSA</div>
      </div>
      <div class="bell">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      </div>
    </div>
    <div class="summary-card" id="summaryCard">
      <div>
        <div class="summary-label">Total Donasi Bulan Ini</div>
        <div class="summary-value">Rp 12.450.000</div>
      </div>
      <div style="text-align:right;">
        <div class="summary-label">Anak Terdaftar</div>
        <div class="summary-value plain">812</div>
      </div>
    </div>
  </div>

  <div class="content" id="content"></div>

  <div class="bottom-nav" id="bottomNav"></div>

  <div class="overlay" id="overlay">
    <div class="overlay-header">
      <button class="overlay-close" id="overlayClose">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F2933" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
      <span class="overlay-title" id="overlayTitle"></span>
    </div>
    <iframe id="overlayFrame" src="about:blank"></iframe>
  </div>

</div>

<script>
// =================================================================================
// KONFIGURASI ICON (inline SVG, gak butuh library luar)
// =================================================================================
const ICONS = {
  home: '<path d="m3 9 9-7 9 7"/><path d="M9 22V12h6v10"/><path d="M21 9v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9"/>',
  wallet: '<path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/>',
  clipboard: '<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  heart: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/>',
  piggy: '<path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-4c1-.5 1.7-1 2-2h2v-4h-2c0-1-.5-1.5-1-2h0V5Z"/><path d="M2 9v1"/><circle cx="16" cy="11" r=".5" fill="currentColor"/>',
  receipt: '<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M8 7h8"/><path d="M8 11h8"/><path d="M8 15h5"/>',
  chart: '<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/><path d="m9 16 2 2 4-4"/>',
  history: '<path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/>',
  userplus: '<path d="M2 21a8 8 0 0 1 13.292-6"/><circle cx="10" cy="8" r="5"/><path d="M19 16v6"/><path d="M22 19h-6"/>',
  shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.79 17 5 19 5a1 1 0 0 1 1 1Z"/><path d="m9 12 2 2 4-4"/>',
  list: '<path d="M3 6h18"/><path d="M3 12h18"/><path d="M3 18h18"/>',
  printer: '<path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/><path d="M6 9V3h12v6"/>',
  gift: '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8Z"/><path d="M16.5 8a2.5 2.5 0 0 0 0-5C13 3 12 8 12 8Z"/>',
  package: '<path d="M16.5 9.4 7.5 4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="M3.29 7.29 12 12l8.71-4.71"/><path d="M12 22V12"/>',
  more: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
  cloud: '<path d="M17.5 19H9a7 7 0 1 1 6.71-9h.79a4.5 4.5 0 1 1 0 9Z"/>',
  bookopen: '<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3Z"/>',
};
function iconSvg(name, color, size) {
  size = size || 20;
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ICONS[name] + '</svg>';
}

const ICON_COLORS = {
  teal:   { bg: "#E1F5EE", fg: "#0F6E56" },
  blue:   { bg: "#E6F1FB", fg: "#185FA5" },
  coral:  { bg: "#FAECE7", fg: "#993C1D" },
  amber:  { bg: "#FAEEDA", fg: "#854F0B" },
  purple: { bg: "#EEEDFE", fg: "#534AB7" },
};

const TABS = [
  { key: "beranda", label: "Beranda", icon: "home" },
  { key: "donasi", label: "Kotak & Donasi", icon: "wallet" },
  { key: "absensi", label: "Absensi", icon: "clipboard" },
  { key: "awg", label: "AWG", icon: "users" },
  { key: "pm", label: "Penerima Manfaat", icon: "heart" },
  { key: "bukubesar", label: "Cloud Buku Besar", icon: "cloud" },
];

// GANTI semua PLACEHOLDER di bawah ini dengan URL asli tiap aplikasi.
const MENUS = {
  beranda: { title: "Beranda", items: [] },
  donasi: {
    title: "Kotak & Donasi",
    items: [
      { label: "Monitoring GOPAY", icon: "piggy", color: "teal", url: "https://script.google.com/macros/s/PLACEHOLDER_KOTAK/exec" },
      { label: "Kirim Nota", icon: "receipt", color: "blue", url: "https://script.google.com/macros/s/PLACEHOLDER_NOTA/exec" },
      { label: "Laporan Donasi", icon: "chart", color: "amber", url: "https://script.google.com/macros/s/PLACEHOLDER_LAPORAN/exec" },
    ],
  },
  absensi: {
    title: "Absensi",
    items: [
      { label: "Absen Sekarang", icon: "calendar", color: "teal", url: "https://script.google.com/macros/s/PLACEHOLDER_ABSENSI/exec" },
      { label: "Riwayat Absensi", icon: "history", color: "blue", url: "https://script.google.com/macros/s/PLACEHOLDER_ABSENSI/exec?view=riwayat" },
    ],
  },
  awg: {
    title: "AWG (Ahli Waris Gojek)",
    // Sesuai 5 tab internal index.html AWG: dashboard, registrasi, penyelesaian, antrian, export.
    // "tab" dipakai buat deep-link -> baseUrl + "?embed=1&tab=" + tab
    baseUrl: "https://yayasansalamsatuaspaldc-eng.github.io/AWG/",
    items: [
      { label: "Beranda AWG", icon: "home", color: "teal", tab: "dashboard" },
      { label: "Data Baru", icon: "userplus", color: "blue", tab: "registrasi" },
      { label: "Kontrol", icon: "shield", color: "coral", tab: "penyelesaian" },
      { label: "List Antrian", icon: "list", color: "amber", tab: "antrian" },
      { label: "Print Data", icon: "printer", color: "purple", tab: "export" },
    ],
  },
  pm: {
    title: "Penerima Manfaat",
    // App utuh (sama kaya AWG), 4 tab internal: dashboard, programDonasi, penerima, distribusi.
    // "tab" dipakai buat deep-link -> baseUrl + "?embed=1&tab=" + tab
    baseUrl: "https://yayasansalamsatuaspaldc-eng.github.io/Penerima-Manfaat/",
    items: [
      { label: "Dashboard & Laporan", icon: "chart", color: "teal", tab: "dashboard" },
      { label: "Program & Donasi", icon: "piggy", color: "blue", tab: "programDonasi" },
      { label: "Data Penerima", icon: "users", color: "coral", tab: "penerima" },
      { label: "Distribusi Bantuan", icon: "package", color: "purple", tab: "distribusi" },
    ],
  },
  bukubesar: {
    title: "Cloud Buku Besar",
    // App utuh (sama kaya AWG & PM), 5 tab internal: dashboard, input, data, laporan, aset.
    baseUrl: "https://yayasansalamsatuaspaldc-eng.github.io/Buku-Besar/",
    items: [
      { label: "Dashboard", icon: "chart", color: "teal", tab: "dashboard" },
      { label: "Input Jurnal", icon: "receipt", color: "blue", tab: "input" },
      { label: "Buku Besar", icon: "bookopen", color: "coral", tab: "data" },
      { label: "Laporan ISAK 35", icon: "printer", color: "amber", tab: "laporan" },
      { label: "Aset & Lokasi", icon: "package", color: "purple", tab: "aset" },
    ],
  },
};

// =================================================================================
// STATE & RENDER
// =================================================================================
let active = "beranda";

function render() {
  renderContent();
  renderBottomNav();
}

function renderContent() {
  const el = document.getElementById("content");
  const summary = document.getElementById("summaryCard");
  summary.style.display = active === "beranda" ? "flex" : "none";

  if (active === "beranda") {
    let html = '<div class="section-title">Akses Cepat</div><div class="quick-grid">';
    TABS.filter((t) => t.key !== "beranda").forEach((t) => {
      html += '<button class="quick-card" onclick="setActive(\'' + t.key + '\')">' +
        '<div class="quick-icon">' + iconSvg(t.icon, "#0B7A45", 18) + '</div>' +
        '<span class="quick-label">' + t.label + '</span></button>';
    });
    html += '</div>';
    el.innerHTML = html;
    return;
  }

  const menu = MENUS[active];

  if (menu.singleApp) {
    let html = '<div class="section-title">' + menu.title + '</div>' +
      '<button class="single-app-card" onclick="openSingleApp()">' +
      '<div class="single-app-icon">' + iconSvg("users", "#0B7A45", 26) + '</div>' +
      '<div class="single-app-text">' +
      '<div class="single-app-title">Buka Aplikasi AWG</div>' +
      '<div class="single-app-desc">' + menu.desc + '</div>' +
      '</div></button>';
    el.innerHTML = html;
    return;
  }

  let html = '<div class="section-title">' + menu.title + '</div><div class="menu-panel"><div class="menu-grid">';
  menu.items.forEach((item, i) => {
    const c = ICON_COLORS[item.color] || ICON_COLORS.teal;
    html += '<button class="menu-item" onclick="openApp(' + i + ')">' +
      '<div class="menu-icon" style="background:' + c.bg + '">' + iconSvg(item.icon, c.fg, 22) + '</div>' +
      '<span class="menu-label">' + item.label + '</span></button>';
  });
  html += '<button class="menu-item" onclick="void(0)">' +
    '<div class="menu-icon" style="background:#F1F2ED">' + iconSvg("more", "#6B7280", 22) + '</div>' +
    '<span class="menu-label">Lihat semua</span></button>';
  html += '</div></div>';
  el.innerHTML = html;
}

function renderBottomNav() {
  const el = document.getElementById("bottomNav");
  let html = "";
  TABS.forEach((t) => {
    const isActive = active === t.key;
    const color = isActive ? "#0B7A45" : "#9CA3AF";
    html += '<button class="nav-btn" onclick="setActive(\'' + t.key + '\')">' +
      iconSvg(t.icon, color, 20) +
      '<span class="nav-label" style="color:' + color + ';font-weight:' + (isActive ? 600 : 400) + '">' + t.label + '</span></button>';
  });
  el.innerHTML = html;
}

function setActive(key) {
  active = key;
  render();
}

function openSingleApp() {
  const menu = MENUS[active];
  document.getElementById("overlayTitle").textContent = menu.title;
  document.getElementById("overlayFrame").src = menu.url;
  document.getElementById("overlay").classList.add("open");
}

function openApp(index) {
  const menu = MENUS[active];
  const item = menu.items[index];
  const resolvedUrl = item.url || (menu.baseUrl + "?embed=1&tab=" + item.tab);
  document.getElementById("overlayTitle").textContent = item.label;
  document.getElementById("overlayFrame").src = resolvedUrl;
  document.getElementById("overlay").classList.add("open");
}

document.getElementById("overlayClose").addEventListener("click", function () {
  document.getElementById("overlay").classList.remove("open");
  document.getElementById("overlayFrame").src = "about:blank";
});

// Daftarkan service worker supaya app ini bisa "Add to Home Screen" / diinstall
// sebagai PWA di HP. Kalau browser tidak mendukung (jarang), diabaikan saja.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function (err) {
      console.warn("Gagal daftar service worker:", err);
    });
  });
}

render();
</script>
</body>
</html>
